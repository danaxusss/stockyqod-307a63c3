# Deploys Supabase Edge Functions from GitHub, so no local terminal is needed.
# Run it from the Actions tab → "Deploy Supabase functions" → "Run workflow".
#
# One-time setup: create a personal access token at
# https://supabase.com/dashboard/account/tokens and save it as the repository
# secret SUPABASE_ACCESS_TOKEN (Settings → Secrets and variables → Actions).
#
# Manual only on purpose: database migrations are applied separately (SQL
# editor), and a function must only go live after the migration it needs.
name: Deploy Supabase functions

on:
  workflow_dispatch:
    inputs:
      functions:
        description: 'Functions to deploy, separated by spaces (folder names in supabase/functions)'
        required: true
        default: 'kiosk product-image-search'

permissions:
  contents: read

concurrency:
  group: deploy-supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: hraxkydlctyoflcilgnz
      FUNCTIONS: ${{ inputs.functions }}
    steps:
      - name: Check the access token
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN repository secret (Settings → Secrets and variables → Actions)."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy
        run: |
          set -euo pipefail
          for fn in $FUNCTIONS; do
            if [ "$fn" = "_shared" ] || [ ! -f "supabase/functions/$fn/index.ts" ]; then
              echo "::error::Unknown function \"$fn\". Choose from: $(ls supabase/functions | grep -v '^_' | tr '\n' ' ')"
              exit 1
            fi
          done
          for fn in $FUNCTIONS; do
            echo "::group::Deploying $fn"
            supabase functions deploy "$fn" --project-ref "$PROJECT_REF" --use-api
            echo "::endgroup::"
          done
